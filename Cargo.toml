[package]
name = "rustzip"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
bzip2 = "0.6.1"
chrono = "0.4.45"
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = "0.37.0"
encoding_rs = "0.8.44"
flate2 = "1.1.11"
lzma-rust2 = "0.25.0"
open = "5.4.5"
png = "0.18.1"
serde_json = "1.0.154"
sevenz-rust2 = "0.25.0"
tar = "0.4.46"
tempfile = "3.27.0"
zip = { version = "9.6.0", default-features = false, features = ["deflate", "aes-crypto", "chrono", "bzip2"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30.13"
