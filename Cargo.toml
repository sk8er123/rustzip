[package]
name = "rustzip"
version = "0.1.0"
edition = "2021"

[dependencies]
aes = "0.9.4"
anyhow = "1.0.104"
brotli = "9.1.3"
bzip2 = "0.6.1"
cab = "0.6.0"
chrono = "0.4.45"
crc32fast = "1.5.5"
delharc = { version = "0.8.0", features = ["lhx"] }
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = "0.37.0"
encoding_rs = "0.8.44"
flate2 = "1.1.11"
hmac = "0.13.0"
lz4_flex = "0.14.2"
lzma-rust2 = "0.25.0"
open = "5.4.5"
pbkdf2 = "0.13.0"
png = "0.18.1"
serde_json = "1.0.154"
sevenz-rust2 = { version = "0.25.0", features = ["zstd", "brotli", "lz4", "deflate"] }
sha1 = "0.11.0"
snap = "1.1.2"
sys-locale = "0.3.2"
tar = "0.4.46"
tempfile = "3.27.0"
unarj-rs = "0.2.1"
unrar = "0.5.8"
zip = { version = "9.6.1", default-features = false, features = ["deflate", "aes-crypto", "chrono", "bzip2", "deflate64", "lzma", "ppmd", "zstd", "xz", "legacy-zip"] }
zstd = "0.14.4"

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30.13"

[dev-dependencies]
sha2 = "0.11.1"
